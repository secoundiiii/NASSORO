<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="androidGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>
  
  <!-- Subtle Grid Pattern in background -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="2">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>
  
  <!-- Android Head + Bugdroid Mascot Glowing Element -->
  <g filter="url(#glow)">
    <!-- Antennae -->
    <line x1="200" y1="150" x2="170" y2="105" stroke="url(#androidGreen)" stroke-width="14" stroke-linecap="round"/>
    <line x1="312" y1="150" x2="342" y2="105" stroke="url(#androidGreen)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Android Head Dome -->
    <path d="M 160 215 A 96 96 0 0 1 352 215 Z" fill="url(#androidGreen)"/>
    
    <!-- Eyes -->
    <circle cx="210" cy="180" r="10" fill="#0f172a"/>
    <circle cx="302" cy="180" r="10" fill="#0f172a"/>
    
    <!-- Body / Chipplate -->
    <path d="M 160 235 H 352 A 20 20 0 0 1 372 255 V 345 A 28 28 0 0 1 344 373 H 168 A 28 28 0 0 1 140 345 V 255 A 20 20 0 0 1 160 235 Z" fill="url(#androidGreen)"/>
    
    <!-- Left Arm -->
    <rect x="108" y="240" width="22" height="88" rx="11" fill="url(#androidGreen)"/>
    
    <!-- Right Arm -->
    <rect x="382" y="240" width="22" height="88" rx="11" fill="url(#androidGreen)"/>
    
    <!-- Legs -->
    <rect x="195" y="375" width="24" height="60" rx="12" fill="url(#androidGreen)"/>
    <rect x="293" y="375" width="24" height="60" rx="12" fill="url(#androidGreen)"/>
    
    <!-- Badge / APK Symbol on chest -->
    <circle cx="256" cy="300" r="34" fill="#0f172a" opacity="0.9"/>
    <path d="M 244 286 L 268 300 L 244 314 Z" fill="#34d399"/>
  </g>
  
  <!-- Subtle APK Badge at bottom right -->
  <g transform="translate(320, 360)">
    <rect width="130" height="52" rx="16" fill="url(#accent)"/>
    <text x="65" y="33" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">APK</text>
  </g>
</svg>
